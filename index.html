<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ff8fbd">
<title>비즈 키링 공방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --panelH: 47vh;
  --ink:#3d2f42; --ink2:#7a6a80; --pink:#ff7fb3; --pink2:#ffd3e5; --paper:#fffaf4;
  --bin:#ebe4da; --binEdge:#e4ddd3; --sticker:#ffe36e;
  --font: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --hand: "Gaegu", "Jua", "Apple SD Gothic Neo", sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:var(--font)}
button{font-family:inherit;color:inherit;cursor:pointer}
body.collapsed{--panelH: 118px}

#stage{position:fixed;left:0;right:0;top:0;bottom:var(--panelH);transition:bottom .25s ease;background:#fff}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}

/* top bar */
#topbar{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;padding:10px;pointer-events:none;gap:8px}
#topbar > *{pointer-events:auto}
.sign{background:#fff;border-radius:14px;box-shadow:0 3px 0 rgba(61,47,66,.18);overflow:hidden;line-height:1}
.sign .awn{height:9px;background:repeating-linear-gradient(90deg,var(--pink) 0 12px,#fff 12px 24px)}
.sign .t{padding:7px 12px 7px;font-size:16px;letter-spacing:-.3px;white-space:nowrap}
.sign .t small{display:block;font-family:var(--hand);font-size:13px;color:var(--ink2);margin-top:3px}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tbtn{border:0;background:#fff;border-radius:999px;padding:8px 12px;font-size:14px;box-shadow:0 3px 0 rgba(61,47,66,.18);white-space:nowrap}
.tbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(61,47,66,.18)}
.tbtn.main{background:var(--pink);color:#fff}
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-family:var(--hand);font-size:14px;color:var(--ink2);background:rgba(255,255,255,.8);padding:3px 10px;border-radius:999px;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}

/* panel */
#panel{position:fixed;left:0;right:0;bottom:0;height:var(--panelH);background:var(--paper);border-top:3px solid var(--ink);display:flex;flex-direction:column;transition:height .25s ease;z-index:2}
.phead{display:flex;align-items:center;gap:8px;padding:8px 10px 4px}
.phead .info{flex:1;font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead .info b{color:var(--pink)}
.pbtn{border:2px solid var(--ink);background:#fff;border-radius:10px;padding:4px 9px;font-size:13px}
#strip{display:flex;gap:6px;overflow-x:auto;padding:4px 10px 6px;min-height:58px;scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
#strip .empty{font-family:var(--hand);color:var(--ink2);font-size:15px;align-self:center}
.chip{flex:0 0 auto;width:48px;height:48px;border-radius:12px;border:2px solid var(--binEdge);background:var(--bin);padding:0;position:relative;overflow:hidden}
.chip img{width:100%;height:100%;object-fit:cover;display:block}
.chip img:not([src]){visibility:hidden}
.chip.sel{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink2)}
.chip .n{position:absolute;left:2px;top:1px;font-size:10px;color:var(--ink2)}
#selbar{display:none;gap:6px;padding:0 10px 6px;align-items:center}
#selbar.on{display:flex}
#selbar .nm{flex:1;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px 8px 0;border-bottom:2px solid var(--ink);scrollbar-width:none;flex:0 0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:2px solid var(--ink);border-bottom:0;background:#f3ece2;border-radius:10px 10px 0 0;padding:6px 11px 5px;font-size:14px;margin-bottom:-2px}
.tab.on{background:#fff;padding-bottom:7px}
.shelf{flex:1;overflow-y:auto;background:#fff;padding:10px;-webkit-overflow-scrolling:touch}
body.collapsed .tabs, body.collapsed .shelf, body.collapsed #selbar{display:none}

/* organizer box */
.box{background:#fbfaf8;border:3px solid #d9d2c8;border-radius:12px;padding:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;box-shadow:inset 0 2px 0 #fff, 0 3px 0 #e8e1d6}
.cell{border:0;background:none;padding:0;text-align:center;position:relative}
.bin{aspect-ratio:1;border-radius:8px;background:var(--bin);box-shadow:inset 0 0 0 2px var(--binEdge), inset 0 6px 10px rgba(0,0,0,.06);overflow:hidden;position:relative}
.bin img{width:100%;height:100%;display:block;object-fit:cover;opacity:0;transition:opacity .2s}
.bin img.ok{opacity:1}
.cell:active .bin{transform:scale(.96)}
.tag{display:flex;align-items:center;justify-content:center;gap:3px;margin-top:3px;font-size:11.5px;line-height:1.15;min-height:26px}
.tag span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.price{position:absolute;right:-3px;top:-4px;background:var(--sticker);border-radius:999px;font-family:var(--hand);font-size:12px;padding:1px 6px;transform:rotate(8deg);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.sec{font-size:14px;margin:12px 2px 6px}
.sec:first-child{margin-top:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{flex:1;min-width:0;border:2px solid var(--ink);border-radius:10px;padding:8px 10px;font-size:16px;font-family:inherit}
.bigbtn{border:2px solid var(--ink);background:var(--pink);color:#fff;border-radius:12px;padding:9px 14px;font-size:15px;box-shadow:0 3px 0 var(--ink)}
.bigbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.bigbtn.sub{background:#fff;color:var(--ink)}
.opt{border:2px solid var(--binEdge);background:#fff;border-radius:10px;padding:6px 10px;font-size:13px}
.opt.on{border-color:var(--pink);background:#fff0f6}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px var(--binEdge);padding:0}
.sw.on{box-shadow:0 0 0 3px var(--pink)}
.note{font-family:var(--hand);font-size:14px;color:var(--ink2);margin:6px 2px}
#cropWrap{display:flex;justify-content:center;margin:8px 0;background:var(--bin);border-radius:12px;padding:10px}
#crop{touch-action:none;border-radius:6px;max-width:100%}
input[type=range]{width:100%;accent-color:var(--pink)}
input[type=color]{width:40px;height:34px;border:2px solid var(--binEdge);border-radius:8px;padding:0;background:#fff}

/* sheets */
.sheet{position:fixed;inset:0;z-index:10;display:none;align-items:flex-end;justify-content:center;background:rgba(40,30,45,.35)}
.sheet.on{display:flex}
.sheet .card{background:var(--paper);width:100%;max-width:560px;max-height:82vh;overflow-y:auto;border-radius:20px 20px 0 0;border:3px solid var(--ink);border-bottom:0;padding:14px 14px 22px}
.sheet h3{margin:0 0 8px;font-size:18px;font-weight:normal;display:flex;justify-content:space-between;align-items:center}
.bgopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.bgopt{border:2px solid var(--binEdge);border-radius:12px;padding:0;background:#fff;overflow:hidden;font-size:12px}
.bgopt canvas{width:100%;aspect-ratio:1;display:block}
.bgopt div{padding:3px 0}
.bgopt.on{border-color:var(--pink)}
#preview{display:flex;justify-content:center;margin:6px 0 10px}
#preview img,#preview video{max-width:100%;max-height:52vh;border-radius:12px;border:2px solid var(--binEdge)}
.rec{position:fixed;inset:0;z-index:9;display:none;align-items:flex-start;justify-content:center;pointer-events:none}
.rec.on{display:flex}
.rec div{margin-top:64px;background:#ff4f7d;color:#fff;border-radius:999px;padding:7px 14px;font-size:15px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}

@media (min-width: 900px){
  #stage{right:440px;bottom:0}
  #panel{left:auto;top:0;width:440px;height:auto;border-top:0;border-left:3px solid var(--ink)}
  body.collapsed{--panelH:47vh}
  #collapseBtn{display:none}
}
</style>
</head>
<body>
<div id="stage">
  <div id="topbar">
    <div class="sign"><div class="awn"></div><div class="t">비즈 키링 공방<small>동대문 부자재 상회 st</small></div></div>
    <div class="tools">
      <button class="tbtn" id="soundBtn">🔈</button>
      <button class="tbtn" id="bgBtn">🎨 배경</button>
      <button class="tbtn" id="shakeBtn">〰 흔들기</button>
      <button class="tbtn main" id="saveBtn">💾 저장</button>
    </div>
  </div>
  <div id="hint">드래그로 돌리기 · 두 손가락 확대 · 비즈를 톡!</div>
</div>

<div id="panel">
  <div class="phead">
    <div class="info" id="info"></div>
    <button class="pbtn" id="clearBtn">비우기</button>
    <button class="pbtn" id="collapseBtn">접기 ▾</button>
  </div>
  <div id="strip"></div>
  <div id="selbar">
    <div class="nm" id="selName"></div>
    <button class="pbtn" id="upBtn">◀ 위로</button>
    <button class="pbtn" id="downBtn">아래로 ▶</button>
    <button class="pbtn" id="delBtn">✕ 빼기</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="shelf" id="shelf"></div>
</div>

<div class="sheet" id="bgSheet"><div class="card">
  <h3>배경 고르기 <button class="pbtn" data-close>닫기</button></h3>
  <div class="sec">단색</div>
  <div class="row" id="bgSolids"></div>
  <div class="sec">패턴</div>
  <div class="bgopts" id="bgPatterns"></div>
  <div class="row" style="margin-top:8px" id="bgCombos"></div>
  <div class="row" style="margin-top:8px;font-size:13px">바탕 <input type="color" id="bgC1"> 무늬 <input type="color" id="bgC2"></div>
  <div class="sec">디자인</div>
  <div class="bgopts" id="bgDesigns"></div>
  <div class="sec">내 사진</div>
  <label class="bigbtn sub" style="display:inline-block">사진 불러오기<input type="file" accept="image/*" id="bgFile" hidden></label>
</div></div>

<div class="sheet" id="saveSheet"><div class="card">
  <h3>저장하기 <button class="pbtn" data-close>닫기</button></h3>
  <div class="row">
    <button class="bigbtn" id="savePng">📷 사진 (PNG)</button>
    <button class="bigbtn" id="saveVid">🎞 움짤 영상 (4초 회전)</button>
  </div>
  <p class="note">지금 화면 비율 그대로 저장돼요. 진열장을 접으면 더 크게 담겨요.</p>
</div></div>

<div class="sheet" id="resultSheet"><div class="card">
  <h3>완성! <button class="pbtn" data-close>닫기</button></h3>
  <div id="preview"></div>
  <div class="row"><button class="bigbtn" id="doSave">파일로 저장</button></div>
  <p class="note" id="resultNote">저장 버튼이 안 먹히면 위 이미지를 길게 눌러 저장해 주세요.</p>
</div></div>

<div class="rec" id="rec"><div id="recTxt">● 녹화 중</div></div>
<div id="toast"></div>
